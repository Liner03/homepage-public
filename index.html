    <!-- 防止主题色闪烁：立即应用保存的主题色和背景 -->
    <script>
        (function() {
            try {
                // 立即应用保存的主题
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme) {
                    document.documentElement.setAttribute('data-theme', savedTheme);
                }

                // 立即应用保存的自定义背景色
                const savedBackgroundColor = localStorage.getItem('custom-background-color');
                if (savedBackgroundColor && (!savedTheme || savedTheme === 'light')) {
                    try {
                        const color = JSON.parse(savedBackgroundColor);
                        const { r, g, b } = color;
                        const alpha1 = 0.9;
                        const alpha2 = 0.8;
                        const alpha3 = 0.7;

                        const color1 = `rgba(${Math.max(0, r - 30)}, ${Math.max(0, g - 30)}, ${Math.max(0, b - 30)}, ${alpha1})`;
                        const color2 = `rgba(${r}, ${g}, ${b}, ${alpha2})`;
                        const color3 = `rgba(${Math.min(255, r + 30)}, ${Math.min(255, g + 30)}, ${Math.min(255, b + 30)}, ${alpha3})`;

                        const gradient = `linear-gradient(135deg, ${color1} 0%, ${color2} 50%, ${color3} 100%)`;
                        document.documentElement.style.setProperty('--bg-primary', gradient);
                    } catch (e) {
                        console.warn('恢复自定义背景色失败:', e);
                    }
                }
            } catch (e) {
                console.warn('主题预加载失败:', e);
            }
        })();
    </script>

<script>
// 应用配置到页面
document.addEventListener('DOMContentLoaded', async function() {
    // 先加载栏目配置
    await loadSectionsConfig();

    // 然后应用 CONFIG
    if (typeof CONFIG !== 'undefined') {
        applyConfig();
    }

    // 延迟初始化调色盘，确保其他脚本已加载
    setTimeout(() => {
        initCircularColorPalette();
    }, 100);
});

// 圆形七彩调色盘功能
function initCircularColorPalette() {
    console.log('初始化圆形七彩调色盘...');
    
    const themeToggle = document.getElementById('theme-toggle');
    const palettePanel = document.getElementById('circular-palette-panel');
    const paletteClose = document.getElementById('palette-close');
    const canvas = document.getElementById('circular-palette');
    const selectedColorDiv = document.getElementById('selected-color');
    const resetBtn = document.getElementById('reset-background');
    
    if (!themeToggle || !palettePanel || !canvas) {
        console.error('调色盘元素未找到');
        return;
    }
    
    let clickCount = 0;
    let clickTimer = null;
    let currentColor = { r: 42, g: 82, b: 152 }; // 默认蓝色
    
    // 绘制圆形七彩调色盘
    function drawColorWheel() {
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = Math.min(centerX, centerY) - 10;
        
        // 清空画布
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 绘制色环
        for (let angle = 0; angle < 360; angle++) {
            const startAngle = (angle - 1) * Math.PI / 180;
            const endAngle = angle * Math.PI / 180;
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.arc(centerX, centerY, radius * 0.3, endAngle, startAngle, true);
            ctx.closePath();
            
            const hue = angle;
            const color = `hsl(${hue}, 100%, 50%)`;
            ctx.fillStyle = color;
            ctx.fill();
        }
        
        // 绘制饱和度渐变
        const gradient = ctx.createRadialGradient(centerX, centerY, radius * 0.3, centerX, centerY, radius);
        gradient.addColorStop(0, 'rgba(255,255,255,1)');
        gradient.addColorStop(0.7, 'rgba(255,255,255,0)');
        gradient.addColorStop(1, 'rgba(0,0,0,0.3)');
        
        ctx.globalCompositeOperation = 'multiply';
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.arc(centerX, centerY, radius * 0.3, 0, Math.PI * 2, true);
        ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
    }
    
    // 从极坐标获取颜色
    function getColorFromPosition(x, y) {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const dx = x - centerX;
        const dy = y - centerY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const radius = Math.min(centerX, centerY) - 10;
        
        // 检查是否在色环内
        if (distance < radius * 0.3 || distance > radius) {
            return null;
        }
        
        let angle = Math.atan2(dy, dx) * 180 / Math.PI;
        if (angle < 0) angle += 360;
        
        const saturation = Math.max(0, Math.min(100, (distance - radius * 0.3) / (radius * 0.7) * 100));
        const lightness = Math.max(30, Math.min(70, 60 - (distance - radius * 0.3) / (radius * 0.7) * 20));
        
        // 将HSL转换为RGB
        const hsl2rgb = (h, s, l) => {
            h /= 360;
            s /= 100;
            l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h * 12) % 12;
                return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            };
            return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
        };
        
        const [r, g, b] = hsl2rgb(angle, saturation, lightness);
        return { r, g, b, angle, saturation, lightness };
    }
    
    // 应用背景颜色
    function applyBackgroundColor(color, saveGlobally = true) {
        // 检查当前是否为暗色主题，如果是暗色主题就不应用自定义背景
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            console.log('暗色主题下不应用自定义背景色');
            return;
        }
        
        const { r, g, b } = color;
        const alpha1 = 0.9;
        const alpha2 = 0.8;
        const alpha3 = 0.7;
        
        // 生成渐变色
        const color1 = `rgba(${Math.max(0, r - 30)}, ${Math.max(0, g - 30)}, ${Math.max(0, b - 30)}, ${alpha1})`;
        const color2 = `rgba(${r}, ${g}, ${b}, ${alpha2})`;
        const color3 = `rgba(${Math.min(255, r + 30)}, ${Math.min(255, g + 30)}, ${Math.min(255, b + 30)}, ${alpha3})`;
        
        const gradient = `linear-gradient(135deg, ${color1} 0%, ${color2} 50%, ${color3} 100%)`;
        
        // 更新CSS变量
        document.documentElement.style.setProperty('--bg-primary', gradient);
        
        // 更新选中颜色显示
        selectedColorDiv.style.background = gradient;
        
        // 保存到本地存储
        localStorage.setItem('custom-background-color', JSON.stringify(color));
        
        // 保存到全局服务器（如果需要）
        if (saveGlobally) {
            saveGlobalThemeColor(color);
        }
    }
    
    // 保存全局主题颜色到服务器
    async function saveGlobalThemeColor(color) {
        try {
            const response = await fetch('/api/theme', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(color)
            });
            
            // 检查是否是501状态码（KV未配置）
            if (response.status === 501) {
                console.log('KV存储未配置，仅支持本地存储');
                showColorSaveNotification('仅本地生效 📱');
                return;
            }
            
            const result = await response.json();
            if (result.success) {
                console.log('全局主题色保存成功:', result.message);
                // 显示保存成功提示
                showColorSaveNotification('全局主题色已更新 🎨');
            } else {
                console.warn('全局主题色保存失败:', result.message);
                showColorSaveNotification('全局保存失败，仅本地生效 ⚠️');
            }
        } catch (error) {
            console.warn('全局主题色保存失败:', error);
            // 网络错误时显示更友好的提示
            if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                showColorSaveNotification('网络连接失败，仅本地生效 📱');
            } else {
                showColorSaveNotification('保存失败，仅本地生效 ⚠️');
            }
        }
    }
    
    // 加载全局主题颜色
    async function loadGlobalThemeColor() {
        try {
            const response = await fetch('/api/theme');
            
            // 检查是否是501状态码（KV未配置）
            if (response.status === 501) {
                console.log('KV存储未配置，跳过全局主题色加载');
                return null;
            }
            
            const result = await response.json();
            
            if (result.success && result.data) {
                console.log('加载全局主题色:', result.data);
                // 应用全局主题色（不再保存到服务器，避免循环）
                applyBackgroundColor(result.data, false);
                return result.data;
            } else {
                console.log('暂无全局主题色设置，使用本地设置');
                return null;
            }
        } catch (error) {
            console.warn('加载全局主题色失败:', error);
            return null;
        }
    }
    
    // 显示颜色保存通知
    function showColorSaveNotification(message) {
        const notification = document.createElement('div');
        notification.className = 'color-save-notification';
        notification.textContent = message;
        
        // 响应式位置调整
        const isMobile = window.innerWidth <= 768;
        const topPosition = isMobile ? '60px' : '80px';
        const rightPosition = isMobile ? '20px' : '30px';
        
        notification.style.cssText = `
            position: fixed;
            top: ${topPosition};
            right: ${rightPosition};
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--border-primary);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: ${isMobile ? '13px' : '14px'};
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-medium);
            z-index: 10000;
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: ${isMobile ? '150px' : '200px'};
            text-align: center;
            will-change: transform, opacity;
        `;
        
        document.body.appendChild(notification);
        
        // 显示动画
        requestAnimationFrame(() => {
            notification.style.opacity = '1';
            notification.style.transform = 'translateX(0)';
        });
        
        // 3秒后自动消失
        setTimeout(() => {
            notification.style.opacity = '0';
            notification.style.transform = 'translateX(50px)';
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 300);
        }, 3000);
    }
    
    // 监听主题变化，确保暗色主题下移除自定义背景
    const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
            if (mutation.type === 'attributes' && mutation.attributeName === 'data-theme') {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                if (currentTheme === 'dark') {
                    // 切换到暗色主题时，强制移除自定义背景色样式
                    document.documentElement.style.removeProperty('--bg-primary');
                    console.log('已切换到暗色主题，移除自定义背景');
                } else {
                    // 切换回亮色主题时，恢复保存的自定义背景色
                    const savedColor = localStorage.getItem('custom-background-color');
                    if (savedColor) {
                        try {
                            const color = JSON.parse(savedColor);
                            applyBackgroundColor(color);
                            console.log('已切换到亮色主题，恢复自定义背景');
                        } catch (e) {
                            console.log('恢复自定义背景失败');
                        }
                    }
                }
            }
        });
    });
    
    // 开始观察主题变化
    observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ['data-theme']
    });
    
    // 使用事件捕获监听连续点击，简化触发机制
    themeToggle.addEventListener('click', function(e) {
        clickCount++;
        console.log('点击计数:', clickCount);
        
        // 清除之前的定时器
        if (clickTimer) {
            clearTimeout(clickTimer);
        }
        
        // 简化触发机制：连续点击4次即可打开调色盘
        if (clickCount === 3) {
            showClickProgressHint('再点击 1 次打开调色盘 🎨');
        } else if (clickCount >= 4) {
            e.preventDefault();
            e.stopPropagation();
            console.log('连续点击4次，打开调色盘');
            
            // 强制切换到亮色主题（如果当前是暗色主题）
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                // 使用ThemeManager来切换主题
                if (window.themeManager && typeof window.themeManager.applyTheme === 'function') {
                    window.themeManager.applyTheme('light');
                }
                showClickProgressHint('已切换到亮色主题，调色盘即将开启！🌈');
                // 延长显示时间，让用户看到主题变化
                setTimeout(() => {
                    // 设置显示标记，防止关闭事件干扰
                    isShowingPalette = true;
                    
                    // 清除可能存在的关闭定时器
                    if (closeTimer) {
                        clearTimeout(closeTimer);
                        closeTimer = null;
                    }
                    
                    if (window.themeManager && window.themeManager.viewportPalette) {
                        window.themeManager.viewportPalette.show();
                    }
                    palettePanel.classList.add('active');
                    
                    // 延迟重置标记，允许正常关闭
                    setTimeout(() => {
                        isShowingPalette = false;
                    }, 500);
                }, 800);
            } else {
                showClickProgressHint('调色盘已开启！🌈');
                // 延迟显示调色盘，先显示成功提示
                setTimeout(() => {
                    // 设置显示标记，防止关闭事件干扰
                    isShowingPalette = true;
                    
                    // 清除可能存在的关闭定时器
                    if (closeTimer) {
                        clearTimeout(closeTimer);
                        closeTimer = null;
                    }
                    
                    if (window.themeManager && window.themeManager.viewportPalette) {
                        window.themeManager.viewportPalette.show();
                    }
                    palettePanel.classList.add('active');
                    
                    // 延迟重置标记，允许正常关闭
                    setTimeout(() => {
                        isShowingPalette = false;
                    }, 500);
                }, 500);
            }
            
            clickCount = 0;
            return false;
        }
        
        // 设置定时器，1.2秒后重置计数（缩短重置时间）
        clickTimer = setTimeout(() => {
            clickCount = 0;
            hideClickProgressHint(); // 隐藏进度提示
        }, 1200);
    }, true); // 使用捕获阶段，在ThemeManager之前执行
    
    // 显示点击进度提示 - 改善位置计算和浏览器兼容性
    function showClickProgressHint(message) {
        // 移除已存在的提示
        const existingHint = document.getElementById('click-progress-hint');
        if (existingHint) {
            existingHint.remove();
        }
        
        const hint = document.createElement('div');
        hint.id = 'click-progress-hint';
        hint.className = 'click-progress-hint';
        hint.textContent = message;
        
        // 添加浏览器检测和位置优化
        const isMobile = window.innerWidth <= 768;
        const isFirefox = navigator.userAgent.toLowerCase().indexOf('firefox') > -1;
        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        
        // 根据设备和浏览器动态调整样式
        let topPosition = '35%';
        let backgroundColor = 'rgba(255, 255, 255, 0.15)';
        
        if (isMobile) {
            topPosition = '25%';
            backgroundColor = 'rgba(255, 255, 255, 0.2)';
        }
        
        if (isFirefox) {
            backgroundColor = 'rgba(30, 30, 40, 0.95)';
        }
        
        if (document.documentElement.getAttribute('data-theme') === 'dark') {
            backgroundColor = isFirefox ? 'rgba(50, 50, 50, 0.95)' : 'rgba(40, 40, 40, 0.9)';
        }
        
        // 设置动态样式
        hint.style.cssText = `
            position: fixed;
            top: ${topPosition};
            left: 50%;
            transform: translate(-50%, -50%);
            background: ${backgroundColor};
            backdrop-filter: ${isFirefox ? 'none' : 'blur(25px)'};
            -webkit-backdrop-filter: ${isFirefox ? 'none' : 'blur(25px)'};
            border: 1px solid var(--border-primary);
            border-radius: ${isMobile ? '10px' : '15px'};
            padding: ${isMobile ? '10px 18px' : '16px 24px'};
            color: var(--text-primary);
            font-size: ${isMobile ? '13px' : '16px'};
            font-weight: 600;
            text-align: center;
            z-index: 10001;
            box-shadow: var(--shadow-heavy);
            opacity: 0;
            scale: 0.8;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            pointer-events: none;
            white-space: ${isMobile && window.innerWidth <= 480 ? 'normal' : 'nowrap'};
            max-width: calc(100vw - ${isMobile ? '30px' : '60px'});
            will-change: transform, opacity;
            line-height: ${isMobile && window.innerWidth <= 480 ? '1.4' : 'normal'};
        `;
        
        document.body.appendChild(hint);
        
        // 显示动画
        requestAnimationFrame(() => {
            hint.style.opacity = '1';
            hint.style.scale = '1';
        });
        
        // 自动隐藏
        setTimeout(() => {
            if (hint.parentNode) {
                hint.style.opacity = '0';
                hint.style.scale = '0.8';
                setTimeout(() => {
                    if (hint.parentNode) {
                        hint.remove();
                    }
                }, 300);
            }
        }, 2500);
    }
    
    // 隐藏点击进度提示
    function hideClickProgressHint() {
        const hint = document.getElementById('click-progress-hint');
        if (hint) {
            hint.style.opacity = '0';
            hint.style.scale = '0.8';
            setTimeout(() => {
                if (hint.parentNode) {
                    hint.remove();
                }
            }, 300);
        }
    }
    
    // 绘制色轮
    drawColorWheel();
    
    let previewColor = null;
    let originalBackground = null;
    
    // 鼠标移动事件 - 只预览，不确认
    canvas.addEventListener('mousemove', (e) => {
        // 检查是否为亮色主题，暗色主题下不预览
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            return;
        }
        
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const color = getColorFromPosition(x, y);
        if (color) {
            // 保存当前预览颜色
            previewColor = color;
            
            // 如果没有保存原始背景，先保存
            if (!originalBackground) {
                const currentBgPrimary = getComputedStyle(document.documentElement).getPropertyValue('--bg-primary').trim();
                originalBackground = currentBgPrimary || 'linear-gradient(135deg, rgba(30, 60, 114, 0.9) 0%, rgba(42, 82, 152, 0.8) 50%, rgba(102, 126, 234, 0.7) 100%)';
            }
            
            // 临时预览背景颜色
            const { r, g, b } = color;
            const color1 = `rgba(${Math.max(0, r - 30)}, ${Math.max(0, g - 30)}, ${Math.max(0, b - 30)}, 0.9)`;
            const color2 = `rgba(${r}, ${g}, ${b}, 0.8)`;
            const color3 = `rgba(${Math.min(255, r + 30)}, ${Math.min(255, g + 30)}, ${Math.min(255, b + 30)}, 0.7)`;
            
            const gradient = `linear-gradient(135deg, ${color1} 0%, ${color2} 50%, ${color3} 100%)`;
            document.documentElement.style.setProperty('--bg-primary', gradient);
            
            // 更新中心颜色显示
            selectedColorDiv.style.background = gradient;
        }
    });
    
    // 鼠标离开画布时恢复原始背景
    canvas.addEventListener('mouseleave', () => {
        // 检查是否为暗色主题，暗色主题下不处理
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            return;
        }
        
        if (originalBackground) {
            // 恢复到确认选择的背景或默认背景
            const savedColor = localStorage.getItem('custom-background-color');
            if (savedColor) {
                try {
                    const color = JSON.parse(savedColor);
                    applyBackgroundColor(color);
                } catch (e) {
                    document.documentElement.style.setProperty('--bg-primary', originalBackground);
                }
            } else {
                document.documentElement.style.removeProperty('--bg-primary');
            }
            
            // 恢复选中颜色显示
            const savedColor2 = localStorage.getItem('custom-background-color');
            if (savedColor2) {
                try {
                    const color = JSON.parse(savedColor2);
                    const { r, g, b } = color;
                    const color1 = `rgba(${Math.max(0, r - 30)}, ${Math.max(0, g - 30)}, ${Math.max(0, b - 30)}, 0.9)`;
                    const color2 = `rgba(${r}, ${g}, ${b}, 0.8)`;
                    const color3 = `rgba(${Math.min(255, r + 30)}, ${Math.min(255, g + 30)}, ${Math.min(255, b + 30)}, 0.7)`;
                    const gradient = `linear-gradient(135deg, ${color1} 0%, ${color2} 50%, ${color3} 100%)`;
                    selectedColorDiv.style.background = gradient;
                } catch (e) {
                    selectedColorDiv.style.background = 'linear-gradient(135deg, rgba(30, 60, 114, 0.9) 0%, rgba(42, 82, 152, 0.8) 50%, rgba(102, 126, 234, 0.7) 100%)';
                }
            } else {
                selectedColorDiv.style.background = 'linear-gradient(135deg, rgba(30, 60, 114, 0.9) 0%, rgba(42, 82, 152, 0.8) 50%, rgba(102, 126, 234, 0.7) 100%)';
            }
        }
        previewColor = null;
    });
    
    // 点击选择颜色 - 确认选择
    canvas.addEventListener('click', (e) => {
        // 检查是否为暗色主题，暗色主题下不确认选择
        const currentTheme = document.documentElement.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            return;
        }
        
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const color = getColorFromPosition(x, y);
        if (color) {
            console.log('确认选择颜色:', color);
            currentColor = color;
            applyBackgroundColor(color);
            
            // 更新原始背景为新选择的颜色
            const { r, g, b } = color;
            const color1 = `rgba(${Math.max(0, r - 30)}, ${Math.max(0, g - 30)}, ${Math.max(0, b - 30)}, 0.9)`;
            const color2 = `rgba(${r}, ${g}, ${b}, 0.8)`;
            const color3 = `rgba(${Math.min(255, r + 30)}, ${Math.min(255, g + 30)}, ${Math.min(255, b + 30)}, 0.7)`;
            originalBackground = `linear-gradient(135deg, ${color1} 0%, ${color2} 50%, ${color3} 100%)`;
        }
    });
    
    // 关闭调色盘面板
    if (paletteClose) {
        paletteClose.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (window.themeManager && window.themeManager.viewportPalette) {
                window.themeManager.viewportPalette.hide();
            }
            palettePanel.classList.remove('active');
        });
    }
    
    // 点击面板外部关闭 - 改进的防冲突机制
    let closeTimer = null;
    let isShowingPalette = false; // 标记是否正在显示调色盘
    
    document.addEventListener('click', (e) => {
        // 如果正在显示调色盘，忽略点击关闭事件
        if (isShowingPalette) {
            return;
        }
        
        if (palettePanel.classList.contains('active') && 
            !palettePanel.contains(e.target) &&
            !e.target.closest('.theme-toggle-container') &&
            !e.target.closest('#viewport-theme-container') &&
            !e.target.closest('.click-progress-hint')) {
            
            // 清除之前的定时器
            if (closeTimer) {
                clearTimeout(closeTimer);
            }
            
            // 延迟关闭，防止与显示逻辑冲突
            closeTimer = setTimeout(() => {
                if (window.themeManager && window.themeManager.viewportPalette) {
                    window.themeManager.viewportPalette.hide();
                }
                palettePanel.classList.remove('active');
                closeTimer = null;
            }, 150);
        }
    });
    
    // 重置按钮
    if (resetBtn) {
        resetBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            e.stopPropagation();

            // 显示重置中状态
            resetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 重置中...';
            resetBtn.disabled = true;

            try {
                // 重置为默认颜色
                const defaultColor = { r: 42, g: 82, b: 152 };
                currentColor = defaultColor;

                // 重置CSS变量为默认值
                document.documentElement.style.removeProperty('--bg-primary');

                // 更新选中颜色显示
                selectedColorDiv.style.background = 'linear-gradient(135deg, rgba(30, 60, 114, 0.9) 0%, rgba(42, 82, 152, 0.8) 50%, rgba(102, 126, 234, 0.7) 100%)';

                // 清除本地存储
                localStorage.removeItem('custom-background-color');

                // 尝试清除服务器端全局主题色
                try {
                    const response = await fetch('/api/theme', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });

                    if (response.status === 501) {
                        console.log('KV存储未配置，仅重置本地设置');
                        showColorSaveNotification('已重置为默认主题色 🎨');
                    } else if (response.ok) {
                        console.log('全局主题色也已重置');
                        showColorSaveNotification('全局主题色已重置 🎨');
                    } else {
                        console.warn('全局主题色重置失败，但本地已重置');
                        showColorSaveNotification('本地主题色已重置 ⚠️');
                    }
                } catch (error) {
                    console.warn('服务器连接失败，仅重置本地设置:', error);
                    showColorSaveNotification('本地主题色已重置 📱');
                }

                console.log('背景颜色已重置为默认');

            } catch (error) {
                console.error('重置失败:', error);
                showColorSaveNotification('重置失败，请重试 ❌');
            } finally {
                // 恢复按钮状态
                setTimeout(() => {
                    resetBtn.innerHTML = '<i class="fas fa-undo"></i> 重置默认';
                    resetBtn.disabled = false;
                }, 1000);
            }
        });
    }
    
    // 加载保存的颜色（优先加载全局设置，然后是本地设置）
    async function loadSavedColors() {
        let colorLoaded = false;
        
        // 首先尝试加载全局主题色
        try {
            const globalColor = await loadGlobalThemeColor();
            if (globalColor) {
                currentColor = globalColor;
                colorLoaded = true;
                console.log('已加载全局主题色');
            }
        } catch (error) {
            console.warn('加载全局主题色失败，尝试本地存储');
        }
        
        // 如果没有全局设置，则使用本地存储
        if (!colorLoaded) {
            const savedColor = localStorage.getItem('custom-background-color');
            if (savedColor) {
                try {
                    const color = JSON.parse(savedColor);
                    currentColor = color;
                    applyBackgroundColor(color, false); // 不再保存到服务器
                    console.log('已加载本地主题色');
                } catch (e) {
                    console.log('加载本地主题色失败:', e);
                }
            }
        }
    }
    
    // 页面加载时初始化
    loadSavedColors();
    
    console.log('圆形七彩调色盘初始化完成');
}

// 全局变量存储栏目配置
let sectionsConfig = null;

// 加载栏目配置
async function loadSectionsConfig() {
    try {
        const response = await fetch('/api/sections');
        if (response.ok) {
            const data = await response.json();
            if (data.success) {
                sectionsConfig = data.sections || [];
                console.log('✅ 已加载栏目配置:', sectionsConfig);
                return sectionsConfig;
            }
        }
    } catch (error) {
        console.warn('⚠️ 无法加载栏目配置，使用默认显示:', error);
    }
    return null;
}

// 检查栏目是否隐藏
function isSectionHidden(sectionId) {
    if (!sectionsConfig) return false;
    const section = sectionsConfig.find(s => s.id === sectionId);
    return section ? section.hidden : false;
}

function applyConfig() {
    console.log('开始应用配置:', CONFIG);
    const { personal, github, social, tags, timeline, websites, projects, skills, texts } = CONFIG;

    // 更新GitHub用户名
    if (github && github.username) {
        window.GITHUB_USERNAME = github.username;
    }

    // 更新页面标题和图标
    if (personal) {
        if (personal.name) {
            document.title = `个人主页 - ${personal.name}`;
        }

        if (personal.favicon) {
            const favicon = document.querySelector('link[rel="shortcut icon"]');
            if (favicon) {
                favicon.href = personal.favicon;
            }
        }

        // 更新头像
        if (personal.avatar) {
            const avatar = document.querySelector('.profile-avatar img');
            if (avatar) {
                avatar.src = personal.avatar;
                avatar.alt = personal.name || '头像';
            }
        }

        // 更新职位标题
        if (personal.title) {
            const titleElement = document.querySelector('.status .title');
            if (titleElement) {
                titleElement.textContent = personal.title;
            }
        }

        // 更新个人格言
        if (personal.quote) {

            if (quoteElement) {

                const highlightBlue = '<span class="highlight-blue">or</span>';
                const highlightPink = '<span class="highlight-pink">so</span>';
                quoteElement.innerHTML = personal.quote.replace('or', highlightBlue).replace('so', highlightPink);
            }
        }

        // 更新地理位置
        if (personal.location) {
            const locationElement = document.querySelector('.location span');
            if (locationElement) {
                locationElement.textContent = personal.location;
            }
        }

        // 更新状态
        if (personal.status) {
            const statusElement = document.querySelector('.name span');
            if (statusElement) {
                statusElement.textContent = personal.status;
            }
        }

        // 更新头像装饰表情
        if (personal.avatarDecorations) {
            const decorationsContainer = document.getElementById('avatar-decorations');
            if (decorationsContainer) {
                // 清空现有装饰
                decorationsContainer.innerHTML = '';
                
                // 将逗号分隔的装饰表情转换为数组
                const decorations = personal.avatarDecorations.split(',');
                
                // 为每个装饰表情创建元素
                decorations.forEach((decoration, index) => {
                    const decorationElement = document.createElement('div');
                    decorationElement.className = `decoration decoration-${index + 1}`;

                    decorationsContainer.appendChild(decorationElement);

    if (social) {

    if (tags) {

    }

    if (timeline) {

    }

    // 更新站点展示
    if (websites) {

    }

    // 更新项目展示
    if (projects) {
        updateProjects(projects);
    }

    // 更新技能展示

    }

    // 更新页面文本

// 渲染动态栏目（根据position字段插入到不同位置）
function renderDynamicSections() {
    if (!sectionsConfig || sectionsConfig.length === 0) {
        console.log('没有动态栏目配置');
        return;
    }

    console.log('开始渲染动态栏目:', sectionsConfig);

    // 获取插入位置
    const contentArea = document.querySelector('.content-area');
    const sidebar = document.querySelector('.sidebar');

    if (!contentArea || !sidebar) {
        console.error('找不到插入位置');
        return;
    }

    // 遍历所有栏目配置
    sectionsConfig.forEach(section => {
        // 跳过隐藏的栏目
        if (section.hidden) {
            console.log(`跳过隐藏栏目: ${section.title}`);
            return;
        }

        // 跳过已有的内置栏目（websites, projects, skills）
        if (['websites', 'projects', 'skills'].includes(section.id)) {
            console.log(`跳过内置栏目: ${section.title}`);
            return;
        }

        // 获取栏目数据
        const sectionData = CONFIG[section.field] || [];
        if (sectionData.length === 0) {
            console.log(`栏目 ${section.title} 无数据`);
            return;
        }

        // 创建栏目HTML
        const sectionElement = createSectionElement(section, sectionData);

        // 根据position插入到不同位置
        if (section.position === 'ip-below') {
            // 插入到左侧边栏时间线之后
            const timeline = sidebar.querySelector('.timeline-section');
            if (timeline) {
                timeline.after(sectionElement);
                console.log(`✅ 已将栏目 "${section.title}" 插入到IP信息下方`);
            }
        } else {
            // 默认插入到右侧内容区域底部
            contentArea.appendChild(sectionElement);
            console.log(`✅ 已将栏目 "${section.title}" 插入到内容下方`);
        }
    });
}

// 创建栏目元素
function createSectionElement(section, data) {
    const sectionElement = document.createElement('section');
    sectionElement.className = `dynamic-section ${section.id}-section`;
    sectionElement.id = `section-${section.id}`;

    // 创建标题
    const title = document.createElement('h2');
    title.innerHTML = `<i class="fas ${section.icon}"></i> ${section.title}`;
    sectionElement.appendChild(title);

    // 根据模板类型渲染内容
    if (section.defaultTemplate === 'card-grid') {
        const grid = document.createElement('div');
        grid.className = 'sites-grid'; // 复用sites-grid样式

        data.forEach(item => {
            if (item.hidden) return;

            const link = document.createElement('a');
            link.href = item.url || '#';
            link.target = '_blank';
            link.className = 'site-link btn-effect';

            link.innerHTML = `
                <div class="site-card">
                    <div class="site-icon">
                        ${item.icon ?
                            (item.icon.startsWith('fa-') ?
                                `<i class="fas ${item.icon}"></i>` :
                                `<img src="${item.icon}" alt="${item.title}">`)
                            : '<i class="fas fa-link"></i>'}
                    </div>
                    <div class="site-info">
                        <h3>${item.title}</h3>
                        ${item.description ? `<p>${item.description}</p>` : ''}
                    </div>
                </div>
            `;

            grid.appendChild(link);
        });

        sectionElement.appendChild(grid);
    } else {
        // 其他模板类型的处理
        const list = document.createElement('div');
        list.className = 'section-list';

        data.forEach(item => {
            if (item.hidden) return;

            const itemElement = document.createElement('div');
            itemElement.className = 'list-item';
            itemElement.innerHTML = `
                <h3>${item.title}</h3>
                ${item.description ? `<p>${item.description}</p>` : ''}
            `;

            list.appendChild(itemElement);
        });

        sectionElement.appendChild(list);
    }

    return sectionElement;
}

function updateSocialLinks(social) {
    const socialContainer = document.querySelector('.social-links');
    if (!socialContainer) {
        console.error('社交链接容器未找到');
        return;
    }

    console.log('更新社交链接:', social);

    // 清空现有链接
    socialContainer.innerHTML = '';

    // 社交平台图标映射
    const iconMap = {
        github: 'fas fa-github',
        email: 'fas fa-envelope',
        wechat: 'fas fa-qrcode',
        telegram: 'fas fa-paper-plane',
        twitter: 'fab fa-twitter',
        linkedin: 'fab fa-linkedin',
        blog: 'fas fa-blog'
    };

    // 添加配置的社交链接
    Object.entries(social).forEach(([platform, url]) => {
        if (!url) return;

        const link = document.createElement('a');
        link.innerHTML = `<i class="${iconMap[platform] || 'fas fa-link'}"></i>`;

        // 邮箱/微信 采用一键复制
        if (platform === 'email' || platform === 'wechat') {
            link.href = 'javascript:void(0)';
            link.title = platform === 'email' ? '复制邮箱' : '复制微信';
            link.addEventListener('click', async (e) => {
                e.preventDefault();
                try {
                    await navigator.clipboard.writeText(url);
                    showToast(platform === 'email' ? '邮箱已复制' : '微信号已复制');
                } catch (err) {
                    console.warn('Clipboard API 不可用，尝试降级方案');
                    const ta = document.createElement('textarea');
                    ta.value = url;
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand('copy'); showToast(platform === 'email' ? '邮箱已复制' : '微信号已复制'); } catch (e) { alert(url); }
                    document.body.removeChild(ta);
                }
            });
        } else {
            // 其他平台正常跳转
            link.href = platform === 'email' ? `mailto:${url}` : url;
            link.target = '_blank';
            link.addEventListener('click', function(e) {
                console.log(`点击了 ${platform} 链接:`, url);
                if (platform === 'email') {
                    window.location.href = `mailto:${url}`;
                } else {
                    window.open(url, '_blank');
                }
            });
        }

        socialContainer.appendChild(link);
        console.log(`添加了 ${platform} 链接:`, url);
    });

    // 创建 Toast 容器（若不存在）
    if (!document.querySelector('.toast-container')) {
        const toast = document.createElement('div');
        toast.className = 'toast-container';
        document.body.appendChild(toast);
    }

    function showToast(message) {
        const container = document.querySelector('.toast-container');
        if (!container) return;
        const item = document.createElement('div');
        item.className = 'toast-item';
        item.textContent = message;
        container.appendChild(item);
        requestAnimationFrame(() => item.classList.add('show'));
        setTimeout(() => {
            item.classList.remove('show');
            setTimeout(() => item.remove(), 300);
        }, 1500);
    }

    // 保留原有的特殊链接（夏日空调）
    const specialLink = document.createElement('a');
    specialLink.href = '#';
    specialLink.onclick = () => showIframe();
    specialLink.title = '夏日空调';
    specialLink.innerHTML = '<i class="fas fa-circle"></i>';
    socialContainer.appendChild(specialLink);

    console.log('社交链接更新完成，共添加了', socialContainer.children.length, '个链接');
}

function updateTags(tags) {

    if (!tagsContainer) return;

    // 清空现有标签
    tagsContainer.innerHTML = '';

    // 添加配置的标签
    tags.forEach(tag => {

}

function updateTimeline(timeline) {
    const timelineContainer = document.querySelector('.timeline-section');
    if (!timelineContainer) return;

    // 检查栏目是否隐藏
    if (isSectionHidden('timeline')) {
        timelineContainer.style.display = 'none';
        console.log('✅ 栏目 "时间线" 已隐藏');
        return;
    }

    // 显示栏目
    timelineContainer.style.display = 'block';

    // 清空现有时间线
    timelineContainer.innerHTML = '';

    // 过滤掉隐藏的事件
    const visibleTimeline = timeline.filter(event => !event.hidden);

    // 添加配置的时间线事件
    visibleTimeline.forEach(event => {
        const timelineItem = document.createElement('div');
        timelineItem.className = 'timeline-item';

        timelineItem.innerHTML = `
            <div class="timeline-dot"></div>
            <div class="timeline-content">
                <div class="timeline-title">${event.title}</div>
                <div class="timeline-date">${event.date}</div>
            </div>
        `;

        timelineContainer.appendChild(timelineItem);
    });
}

function updateWebsites(websites) {
    const websitesSection = document.querySelector('.sites-section');
    const websitesGrid = document.querySelector('.sites-grid');
    if (!websitesGrid) return;

    // 检查栏目是否隐藏
    if (isSectionHidden('websites')) {
        if (websitesSection) websitesSection.style.display = 'none';
        console.log('✅ 栏目 "我的站点" 已隐藏');
        return;
    }

    // 显示栏目
    if (websitesSection) websitesSection.style.display = 'block';

    // 清空现有网站
    websitesGrid.innerHTML = '';

    // 过滤掉隐藏的项目
    const visibleWebsites = websites.filter(site => !site.hidden);

    // 添加配置的网站
    visibleWebsites.forEach(site => {
        const siteLink = document.createElement('a');
        siteLink.href = site.url;
        siteLink.target = '_blank';
        siteLink.className = 'site-link btn-effect';

        siteLink.innerHTML = `
            <div class="site-card">
                <div class="site-icon">
                    ${site.icon ?
                        (site.icon.startsWith('fa-') ?
                            `<i class="fas ${site.icon}"></i>` :
                            `<img src="${site.icon}" alt="${site.title}">`)
                        : '<i class="fas fa-globe"></i>'}
                </div>
                <div class="site-info">
                    <h3>${site.title}</h3>
                    <p>${site.description}</p>
                </div>
            </div>
        `;

        websitesGrid.appendChild(siteLink);
    });
}

function updateSkills(skills) {
    const skillsSection = document.querySelector('.skills-section:last-of-type'); // 最后一个 skills-section
    const skillsContainer = document.querySelector('.skills-icons');
    if (!skillsContainer) return;

    // 检查栏目是否隐藏
    if (isSectionHidden('skills')) {
        if (skillsSection) skillsSection.style.display = 'none';
        console.log('✅ 栏目 "技能栈" 已隐藏');
        return;
    }

    // 显示栏目
    if (skillsSection) skillsSection.style.display = 'block';

    // 清空现有技能
    skillsContainer.innerHTML = '';

    // 过滤掉隐藏的技能
    const visibleSkills = skills.filter(skill => !skill.hidden);

    // 添加配置的技能
    visibleSkills.forEach(skill => {
        const skillIcon = document.createElement('div');
        skillIcon.className = 'skill-icon';
        skillIcon.title = `${skill.name}${skill.level ? ' - ' + skill.level : ''}`;

        // 支持 Font Awesome 图标类名或图片 URL
        if (skill.icon) {
            if (skill.icon.startsWith('fa-')) {
                // Font Awesome 图标
                skillIcon.innerHTML = `<i class="fas ${skill.icon}"></i>`;
            } else {
                // 图片 URL
                skillIcon.innerHTML = `<img src="${skill.icon}" alt="${skill.name}">`;
            }
        } else {
            // 没有图标时显示文字
            skillIcon.innerHTML = `<span>${skill.name}</span>`;
        }

        skillsContainer.appendChild(skillIcon);
    });
}

function updateTexts(texts) {
    // 更新GitHub统计区域文本
    if (texts.githubStats) {
        const { githubStats } = texts;

        // 总提交数
        const totalCommitsLabel = document.getElementById('total-commits-label');
        if (totalCommitsLabel) totalCommitsLabel.textContent = githubStats.totalCommitsLabel;

        const totalCommitsText = document.getElementById('total-commits-text');
        if (totalCommitsText) {
            totalCommitsText.innerHTML = `${githubStats.totalCommitsText} <span class="highlight-number" id="total-commits">0</span> ${githubStats.totalCommitsUnit}`;
        }

        // 连续统计
        const streakLabel = document.getElementById('streak-label');
        if (streakLabel) streakLabel.textContent = githubStats.streakLabel;

        // 活跃度
        const activityLabel = document.getElementById('activity-label');
        if (activityLabel) activityLabel.textContent = githubStats.activityLabel;

        // 主要语言
        const mainLanguageLabel = document.getElementById('main-language-label');
        if (mainLanguageLabel) mainLanguageLabel.textContent = githubStats.mainLanguageLabel;
    }

    // 更新区域标题
    if (texts.sectionTitles) {
        const { sectionTitles } = texts;

        const welcomeTitle = document.getElementById('welcome-title');
        if (welcomeTitle) welcomeTitle.textContent = sectionTitles.welcome;

        const visitorIPLabel = document.getElementById('visitor-ip-label');
        if (visitorIPLabel) visitorIPLabel.textContent = sectionTitles.visitorIP;

        const websitesTitle = document.getElementById('websites-title');
        if (websitesTitle) websitesTitle.textContent = sectionTitles.websites;

        const projectsTitle = document.getElementById('projects-title');
        if (projectsTitle) projectsTitle.textContent = sectionTitles.projects;

        const skillsTitle = document.getElementById('skills-title');
        if (skillsTitle) skillsTitle.textContent = sectionTitles.skills;
    }

    // 更新页脚
    if (texts.footer) {
        const { footer } = texts;
        const footerText = document.getElementById('footer-text');
        if (footerText) {
            footerText.innerHTML = `© ${footer.year} ${footer.text} <a href="${footer.authorUrl}" target="_blank">${footer.author}</a>`;
        }
    }
}

// 窗口尺寸变化的动态适配
window.addEventListener('resize', function() {
    // 如果调色盘正在显示，重新调整位置
    const palettePanel = document.getElementById('circular-palette-panel');
    if (palettePanel && palettePanel.classList.contains('active')) {
        // 使用JavaScript中统一的位置管理函数，而不是直接设置CSS
        setTimeout(() => {
            // 调用统一的调色盘位置更新函数，确保跨浏览器兼容性
            if (window.paletteManager && window.paletteManager.updateVisiblePosition) {
                window.paletteManager.updateVisiblePosition();
            }
        }, 100);
    }
    
    // 如果进度提示正在显示，也要重新调整
    const progressHint = document.getElementById('click-progress-hint');
    if (progressHint) {
        setTimeout(() => {
            // 使用CSS类名确保响应式样式生效
            progressHint.className = 'click-progress-hint';
        }, 100);
    }
});

// 屏幕方向变化时的处理（移动端）
window.addEventListener('orientationchange', function() {
    setTimeout(() => {
        // 方向变化后重新调整调色盘
        const palettePanel = document.getElementById('circular-palette-panel');
        if (palettePanel && palettePanel.classList.contains('active')) {
            // 使用JavaScript中统一的位置管理函数，确保跨浏览器兼容性
            if (window.paletteManager && window.paletteManager.updateVisiblePosition) {
                window.paletteManager.updateVisiblePosition();
            }
        }
        
        // 重新调整进度提示
        const progressHint = document.getElementById('click-progress-hint');
        if (progressHint) {
            progressHint.className = 'click-progress-hint';
        }
    }, 300); // 等待方向变化动画完成
});
