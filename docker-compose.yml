version: '3.8'

services:
  # 后端服务
  backend:
    build: ./backend
    container_name: homepage-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 访问统计存储方式: json | sqlite | cloudflare
      - VISIT_STORAGE=json
      # GitHub Token（可选，用于精确贡献日历）
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Cloudflare KV 配置（仅当 VISIT_STORAGE=cloudflare 时需要）
      # - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      # - CLOUDFLARE_NAMESPACE_ID=${CLOUDFLARE_NAMESPACE_ID:-}
      # - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
    volumes:
      # 持久化数据目录
      - ./backend/data:/app/data
      # 挂载前端静态文件
      - ./index.html:/app/index.html:ro
      - ./static:/app/static:ro
      - ./modules:/app/modules:ro
      - ./config.js:/app/config.js:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Nginx 反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: homepage-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./static:/usr/share/nginx/html/static:ro
      - ./modules:/usr/share/nginx/html/modules:ro
      - ./config.js:/usr/share/nginx/html/config.js:ro
    depends_on:
      - backend
    profiles:
      - production

volumes:
  backend-data:
    driver: local
