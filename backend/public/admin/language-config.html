<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语言配置管理 - 管理后台</title>
    <link rel="stylesheet" href="/admin/style.css">
    <style>
        .language-list {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
        }

        .language-item {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            align-items: center;
        }

        .language-item .language-name {
            font-weight: 600;
            color: #333;
        }

        .language-item .css-class {
            color: #667eea;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .language-item .actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-edit {
            background: #667eea;
            color: white;
        }

        .btn-edit:hover {
            background: #5568d3;
        }

        .btn-delete {
            background: #f56565;
            color: white;
        }

        .btn-delete:hover {
            background: #e53e3e;
        }

        .add-language-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            padding: 20px;
            background: #f0f4ff;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .add-language-form input {
            padding: 10px 14px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            font-size: 14px;
        }

        .add-language-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input {
            padding: 10px 14px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            flex: 1;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            color: white;
        }

        .stat-number {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="admin-header">
            <div class="header-content">
                <h1>语言配置管理</h1>
                <div class="header-actions">
                    <a href="/admin/dashboard" class="btn btn-secondary">返回仪表板</a>
                </div>
            </div>
        </header>

        <main class="admin-main">
            <!-- 统计卡片 -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="total-languages">0</div>
                    <div class="stat-label">配置的语言</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="total-css-classes">0</div>
                    <div class="stat-label">CSS 类名</div>
                </div>
            </div>

            <!-- 添加语言表单 -->
            <div class="add-language-form">
                <input type="text" id="new-language" placeholder="语言名称（例如：JavaScript）" />
                <input type="text" id="new-css-class" placeholder="CSS 类名（例如：js）" />
                <button class="btn btn-primary" onclick="addLanguage()">添加语言</button>
            </div>

            <!-- 操作按钮 -->
            <div class="action-bar" style="margin-bottom: 20px;">
                <button class="btn btn-warning" onclick="resetToDefault()">重置为默认配置</button>
                <button class="btn btn-secondary" onclick="loadLanguageConfig()">刷新列表</button>
            </div>

            <!-- 语言列表 -->
            <div id="language-list" class="language-list">
                <!-- 语言列表将通过 JavaScript 动态生成 -->
            </div>
        </main>
    </div>

    <!-- 编辑模态框 -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">编辑语言配置</div>
            <div class="modal-body">
                <div class="form-group">
                    <label>语言名称</label>
                    <input type="text" id="edit-language" readonly />
                </div>
                <div class="form-group">
                    <label>CSS 类名</label>
                    <input type="text" id="edit-css-class" />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
                <button class="btn btn-primary" onclick="saveEdit()">保存</button>
            </div>
        </div>
    </div>

    <script>
        let currentLanguageConfig = {};
        let editingLanguage = null;

        // 页面加载时获取配置
        document.addEventListener('DOMContentLoaded', function() {
            loadLanguageConfig();
        });

        // 加载语言配置
        async function loadLanguageConfig() {
            try {
                const response = await fetch('/api/language-config');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();
                if (result.success && result.data) {
                    currentLanguageConfig = result.data;
                    renderLanguageList();
                    updateStats();
                }
            } catch (error) {
                console.error('加载语言配置失败:', error);
                showToast('加载配置失败', 'error');
            }
        }

        // 渲染语言列表
        function renderLanguageList() {
            const listContainer = document.getElementById('language-list');

            if (Object.keys(currentLanguageConfig).length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p>暂无语言配置，请添加新的语言配置</p>
                    </div>
                `;
                return;
            }

            const html = Object.entries(currentLanguageConfig)
                .sort((a, b) => a[0].localeCompare(b[0]))
                .map(([language, cssClass]) => `
                    <div class="language-item">
                        <div class="language-name">${language}</div>
                        <div class="css-class">.${cssClass}</div>
                        <div class="actions">
                            <button class="btn-small btn-edit" onclick="openEditModal('${language}')">编辑</button>
                            <button class="btn-small btn-delete" onclick="deleteLanguage('${language}')">删除</button>
                        </div>
                    </div>
                `).join('');

            listContainer.innerHTML = html;
        }

        // 更新统计信息
        function updateStats() {
            const totalLanguages = Object.keys(currentLanguageConfig).length;
            const uniqueCssClasses = new Set(Object.values(currentLanguageConfig)).size;

            document.getElementById('total-languages').textContent = totalLanguages;
            document.getElementById('total-css-classes').textContent = uniqueCssClasses;
        }

        // 添加语言
        async function addLanguage() {
            const language = document.getElementById('new-language').value.trim();
            const cssClass = document.getElementById('new-css-class').value.trim();

            if (!language || !cssClass) {
                showToast('请填写语言名称和CSS类名', 'error');
                return;
            }

            if (currentLanguageConfig[language]) {
                showToast(`语言 "${language}" 已存在，请使用编辑功能`, 'error');
                return;
            }

            try {
                const response = await fetch(`/api/language-config/${encodeURIComponent(language)}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ cssClass })
                });

                const result = await response.json();
                if (result.success) {
                    showToast('添加成功', 'success');
                    document.getElementById('new-language').value = '';
                    document.getElementById('new-css-class').value = '';
                    loadLanguageConfig();
                } else {
                    showToast(result.message || '添加失败', 'error');
                }
            } catch (error) {
                console.error('添加语言失败:', error);
                showToast('添加失败', 'error');
            }
        }

        // 打开编辑模态框
        function openEditModal(language) {
            editingLanguage = language;
            document.getElementById('edit-language').value = language;
            document.getElementById('edit-css-class').value = currentLanguageConfig[language];
            document.getElementById('edit-modal').classList.add('active');
        }

        // 关闭编辑模态框
        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('active');
            editingLanguage = null;
        }

        // 保存编辑
        async function saveEdit() {
            const cssClass = document.getElementById('edit-css-class').value.trim();

            if (!cssClass) {
                showToast('CSS类名不能为空', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/language-config/${encodeURIComponent(editingLanguage)}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ cssClass })
                });

                const result = await response.json();
                if (result.success) {
                    showToast('保存成功', 'success');
                    closeEditModal();
                    loadLanguageConfig();
                } else {
                    showToast(result.message || '保存失败', 'error');
                }
            } catch (error) {
                console.error('保存失败:', error);
                showToast('保存失败', 'error');
            }
        }

        // 删除语言
        async function deleteLanguage(language) {
            if (!confirm(`确定要删除语言 "${language}" 吗？`)) {
                return;
            }

            try {
                const response = await fetch(`/api/language-config/${encodeURIComponent(language)}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    showToast('删除成功', 'success');
                    loadLanguageConfig();
                } else {
                    showToast(result.message || '删除失败', 'error');
                }
            } catch (error) {
                console.error('删除失败:', error);
                showToast('删除失败', 'error');
            }
        }

        // 重置为默认配置
        async function resetToDefault() {
            if (!confirm('确定要重置为默认配置吗？这将清除所有自定义配置！')) {
                return;
            }

            try {
                const response = await fetch('/api/language-config/reset', {
                    method: 'POST'
                });

                const result = await response.json();
                if (result.success) {
                    showToast('重置成功', 'success');
                    loadLanguageConfig();
                } else {
                    showToast(result.message || '重置失败', 'error');
                }
            } catch (error) {
                console.error('重置失败:', error);
                showToast('重置失败', 'error');
            }
        }

        // 显示提示消息
        function showToast(message, type = 'info') {
            // 创建toast容器（如果不存在）
            let toastContainer = document.getElementById('toast-container');
            if (!toastContainer) {
                toastContainer = document.createElement('div');
                toastContainer.id = 'toast-container';
                toastContainer.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    z-index: 10000;
                    display: flex;
                    flex-direction: column;
                    gap: 10px;
                `;
                document.body.appendChild(toastContainer);
            }

            // 创建toast元素
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            toast.style.cssText = `
                padding: 12px 20px;
                background: ${type === 'success' ? '#48bb78' : type === 'error' ? '#f56565' : '#667eea'};
                color: white;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                animation: slideIn 0.3s ease-out;
            `;

            toastContainer.appendChild(toast);

            // 3秒后自动移除
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-in';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // 点击模态框外部关闭
        document.getElementById('edit-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditModal();
            }
        });

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }

            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
