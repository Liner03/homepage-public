<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语言标签管理 - 管理后台</title>
    <!-- Heroicons 图标库 -->
    <script src="/static/icons.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --apple-blue: #007AFF;
            --apple-blue-hover: #0051D5;
            --apple-green: #34C759;
            --apple-red: #FF3B30;
            --apple-orange: #FF9500;

            --bg-primary: #F5F5F7;
            --bg-secondary: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --border-color: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(0, 0, 0, 0.03);
            --input-border: rgba(0, 0, 0, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.1);

            --ease-out: cubic-bezier(0, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .header {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px var(--shadow-color);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--apple-blue);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 16px;
            transition: var(--ease-out) 0.2s;
        }

        .back-link:hover {
            color: var(--apple-blue-hover);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 2px 8px var(--shadow-color);
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            letter-spacing: -0.3px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s var(--ease-out);
            font-family: inherit;
        }

        .btn-primary {
            background: var(--apple-blue);
            color: white;
        }

        .btn-primary:hover {
            background: var(--apple-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .btn-secondary {
            background: var(--input-bg);
            color: var(--text-primary);
            border: 1px solid var(--input-border);
        }

        .btn-danger {
            background: var(--apple-red);
            color: white;
        }

        .btn-danger:hover {
            background: #cc2f26;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
        }

        .status-message {
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .status-message.success {
            background: rgba(52, 199, 89, 0.1);
            border: 1px solid rgba(52, 199, 89, 0.2);
            color: var(--apple-green);
        }

        .status-message.error {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.2);
            color: var(--apple-red);
        }

        .status-message.show {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tag-list {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tag-item {
            display: grid;
            grid-template-columns: 1fr 100px auto;
            gap: 16px;
            align-items: center;
            padding: 16px 20px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            transition: all 0.2s var(--ease-out);
        }

        .tag-item:hover {
            background: var(--bg-secondary);
            border-color: var(--apple-blue);
        }

        .tag-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .tag-percent {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag-percent input {
            width: 60px;
            padding: 6px 10px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }

        .tag-actions {
            display: flex;
            gap: 8px;
        }

        .add-tag-form {
            display: grid;
            grid-template-columns: 1fr 120px auto;
            gap: 12px;
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 15px;
            color: var(--text-primary);
            transition: all 0.2s var(--ease-out);
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            background: var(--bg-secondary);
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .percent-bar {
            margin-top: 12px;
            background: var(--input-bg);
            border-radius: 6px;
            height: 8px;
            overflow: hidden;
        }

        .percent-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--apple-blue), var(--apple-green));
            transition: width 0.3s var(--ease-out);
        }

        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .card {
            animation: slideIn 0.4s var(--ease-out);
        }

        .total-percent {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--input-bg);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .total-percent.valid {
            color: var(--apple-green);
            background: rgba(52, 199, 89, 0.1);
        }

        .total-percent.invalid {
            color: var(--apple-red);
            background: rgba(255, 59, 48, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/admin/dashboard" class="back-link">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 12L6 8l4-4"/>
            </svg>
            返回仪表板
        </a>

        <div class="header">
            <h1>🏷️ 语言标签管理</h1>
            <p>手动添加和管理前台显示的编程语言标签及百分比</p>
        </div>

        <!-- 配置卡片 -->
        <div class="card">
            <div class="card-title">配置语言标签</div>
            <div id="status-message" class="status-message"></div>

            <div style="margin-bottom: 24px;">
                <p style="color: var(--text-secondary); margin-bottom: 16px; font-size: 14px; line-height: 1.6;">
                    在下方输入框中配置语言标签，格式为：<code style="background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 4px;">语言名 百分比</code>，多个标签用逗号分隔
                </p>
                <div style="background: rgba(102, 126, 234, 0.05); padding: 16px; border-radius: 10px; border-left: 4px solid #667eea; margin-bottom: 20px;">
                    <div style="font-size: 13px; color: var(--text-secondary); line-height: 1.6;">
                        <strong style="color: #667eea;">💡 示例：</strong><br>
                        <code style="background: white; padding: 8px 12px; border-radius: 6px; display: inline-block; margin-top: 8px; border: 1px solid rgba(0,0,0,0.1);">JavaScript 35, Python 25, TypeScript 20, CSS 20</code>
                    </div>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-primary);">语言标签配置</label>
                <textarea id="tags-input"
                          placeholder="JavaScript 35, Python 25, TypeScript 20, CSS 20"
                          style="width: 100%; min-height: 120px; padding: 12px; border: 1px solid var(--input-border); border-radius: 8px; font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace; font-size: 14px; resize: vertical; background: var(--input-bg); transition: all 0.2s ease;"
                          onfocus="this.style.borderColor='#667eea'; this.style.background='white';"
                          onblur="this.style.borderColor='var(--input-border)'; this.style.background='var(--input-bg)';"
                ></textarea>
                <small style="color: var(--text-secondary); font-size: 13px; margin-top: 6px; display: block;">
                    ⚠️ 确保所有百分比总和等于 100%
                </small>
                <div id="total-percent" style="margin-top: 10px; font-weight: 600; font-size: 14px;">
                    <!-- 总计显示 -->
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" onclick="loadTags()">刷新</button>
                <button class="btn btn-danger" onclick="resetToDefault()">重置为默认</button>
                <button class="btn btn-primary" onclick="saveTags()">保存配置</button>
            </div>
        </div>
    </div>

    <script>
        // 页面加载时获取标签
        document.addEventListener('DOMContentLoaded', function() {
            loadTags();
            // 监听输入变化以更新总计
            document.getElementById('tags-input').addEventListener('input', updateTotalFromInput);
        });

        // 加载标签
        async function loadTags() {
            try {
                const response = await fetch('/api/language-tags');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();
                if (result.success && result.data) {
                    // 将数组转换为逗号分隔的字符串
                    const tagsString = result.data.map(tag => `${tag.lang} ${tag.percent}`).join(', ');
                    document.getElementById('tags-input').value = tagsString;
                    updateTotalFromInput();
                }
            } catch (error) {
                console.error('加载标签失败:', error);
                showMessage('加载标签失败', 'error');
            }
        }

        // 从输入框解析标签
        function parseTagsFromInput() {
            const input = document.getElementById('tags-input').value.trim();
            if (!input) return [];

            const tags = [];
            const items = input.split(',').map(s => s.trim()).filter(s => s);

            for (const item of items) {
                const parts = item.split(/\s+/);
                if (parts.length < 2) continue;

                const percent = parseInt(parts[parts.length - 1]);
                const lang = parts.slice(0, -1).join(' ');

                if (lang && !isNaN(percent)) {
                    tags.push({ lang, percent });
                }
            }

            return tags;
        }

        // 更新总计显示
        function updateTotalFromInput() {
            const tags = parseTagsFromInput();
            const total = tags.reduce((sum, tag) => sum + tag.percent, 0);
            const el = document.getElementById('total-percent');

            if (tags.length === 0) {
                el.textContent = '';
                return;
            }

            el.textContent = `总计: ${total}%`;
            el.style.color = total === 100 ? '#48bb78' : '#f56565';
        }

        // 保存所有标签
        async function saveTags() {
            const tags = parseTagsFromInput();

            if (tags.length === 0) {
                showMessage('至少需要添加一个标签', 'error');
                return;
            }

            const total = tags.reduce((sum, tag) => sum + tag.percent, 0);
            if (total !== 100) {
                showMessage(`百分比总和必须为 100%（当前：${total}%）`, 'error');
                return;
            }

            try {
                const response = await fetch('/api/language-tags', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(tags)
                });

                const result = await response.json();
                if (result.success) {
                    showMessage('保存成功！刷新前台页面即可看到效果', 'success');
                } else {
                    showMessage(result.message || '保存失败', 'error');
                }
            } catch (error) {
                console.error('保存失败:', error);
                showMessage('保存失败', 'error');
            }
        }

        // 重置为默认
        async function resetToDefault() {
            if (!confirm('确定要重置为默认标签吗？')) {
                return;
            }

            try {
                const response = await fetch('/api/language-tags/reset', {
                    method: 'POST'
                });

                const result = await response.json();
                if (result.success) {
                    showMessage('重置成功', 'success');
                    loadTags();
                } else {
                    showMessage(result.message || '重置失败', 'error');
                }
            } catch (error) {
                console.error('重置失败:', error);
                showMessage('重置失败', 'error');
            }
        }

        // 显示消息
        function showMessage(message, type = 'success') {
            const messageEl = document.getElementById('status-message');
            messageEl.textContent = message;
            messageEl.className = `status-message ${type} show`;

            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
